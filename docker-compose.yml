services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hybrid-rag-backend
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - hybrid-rag-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: hybrid-rag-frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "8501:8501"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - hybrid-rag-network

networks:
  hybrid-rag-network:
    driver: bridge
